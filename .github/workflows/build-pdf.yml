name: Build ebook PDF

on:
  push:
    branches: [main]
    paths:
      - ebook/microgreens-seed-to-sale.md
      - ebook/template.tex
      - build.sh
      - .github/workflows/build-pdf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PDF with Pandoc and LaTeX
        run: |
          mkdir -p ebook/dist
          docker run --rm --volume "$PWD":/data pandoc/latex:3.1 \
            ebook/microgreens-seed-to-sale.md --from gfm --pdf-engine=xelatex \
            --toc --number-sections --resource-path=ebook \
            --template=ebook/template.tex \
            --output=ebook/dist/Microgreens-From-Seed-to-Sale.pdf
      - name: Upload downloadable PDF
        uses: actions/upload-artifact@v4
        with:
          name: Microgreens-From-Seed-to-Sale
          path: ebook/dist/Microgreens-From-Seed-to-Sale.pdf
          if-no-files-found: error
